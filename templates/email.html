<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>{{TITLE}}</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                         Arial, sans-serif;
            color: #202124;
        }

        table {
            border-collapse: collapse;
        }

        img {
            border: 0;
            display: block;
            max-width: 100%;
        }

        a {
            text-decoration: none;
        }

        .email-wrapper {
            width: 100%;
            background: #f4f5f7;
        }

        .email-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
        }

        /* Header */

        .header {
            padding: 32px 24px 24px;
            border-bottom: 1px solid #eeeeee;
        }

        .brand {
            margin: 0;
            font-size: 28px;
            line-height: 36px;
            font-weight: 700;
            color: #111111;
        }

        .date {
            margin-top: 6px;
            font-size: 13px;
            line-height: 20px;
            color: #777777;
        }

        /* Section */

        .section {
            padding: 24px;
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 20px;
            line-height: 28px;
            font-weight: 700;
            color: #111111;
        }

        /* Summary */

        .summary {
            padding: 20px;
            background: #f7f8fa;
            border-radius: 10px;
            font-size: 15px;
            line-height: 26px;
            color: #444444;
        }

        .summary-overview {
            margin: 0 0 12px;
        }

        .key-points {
            margin: 0;
            padding-left: 20px;
        }

        .key-points li {
            margin-bottom: 6px;
            font-size: 14px;
            line-height: 24px;
            color: #555555;
        }

        /* Highlight Card (重点新闻) */

        .hl-card {
            margin-bottom: 16px;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
        }

        .hl-image {
            width: 100%;
            height: auto;
        }

        .hl-body {
            padding: 18px;
        }

        .hl-title {
            margin: 0 0 8px;
            font-size: 18px;
            line-height: 27px;
            font-weight: 700;
            color: #111111;
        }

        .hl-meta {
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 18px;
            color: #888888;
        }

        .hl-summary {
            margin: 0 0 12px;
            font-size: 14px;
            line-height: 24px;
            color: #555555;
        }

        .hl-tags {
            margin-bottom: 10px;
        }

        .hl-tags span {
            display: inline-block;
            margin: 0 4px 4px 0;
            padding: 2px 8px;
            border-radius: 4px;
            background: #f0f2f5;
            font-size: 11px;
            line-height: 18px;
            color: #666666;
        }

        .hl-link {
            display: inline-block;
            font-size: 13px;
            line-height: 20px;
            font-weight: 600;
            color: #2463eb;
        }

        /* Category Section (栏目) */

        .category-section {
            padding: 24px;
            border-top: 8px solid #f4f5f7;
        }

        .category-head {
            margin-bottom: 16px;
        }

        .category-name {
            margin: 0 0 4px;
            font-size: 20px;
            line-height: 28px;
            font-weight: 700;
            color: #111111;
        }

        .category-desc {
            margin: 0;
            font-size: 12px;
            line-height: 20px;
            color: #999999;
        }

        /* Category Item (单条新闻) */

        .cat-item {
            padding: 14px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .cat-item:last-child {
            border-bottom: none;
        }

        .cat-item-title {
            margin: 0 0 6px;
            font-size: 16px;
            line-height: 24px;
            font-weight: 600;
            color: #222222;
        }

        .cat-item-meta {
            margin-bottom: 6px;
            font-size: 12px;
            line-height: 18px;
            color: #888888;
        }

        .cat-item-summary {
            margin: 0;
            font-size: 14px;
            line-height: 23px;
            color: #666666;
        }

        .cat-item-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            line-height: 18px;
            color: #2463eb;
        }

        /* Chips (类型/重要性/未证实) */

        .chip {
            display: inline-block;
            margin-right: 4px;
            padding: 1px 7px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 17px;
            font-weight: 600;
            vertical-align: 1px;
        }

        .chip-imp {
            background: #eef2ff;
            color: #2463eb;
        }

        .chip-rumor {
            background: #fff4e5;
            color: #b45309;
        }

        /* Web Button */

        .web-section {
            padding: 28px 24px;
            text-align: center;
            border-top: 8px solid #f4f5f7;
        }

        .web-button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            background: #111111;
            color: #ffffff !important;
            font-size: 14px;
            line-height: 20px;
            font-weight: 600;
        }

        /* Footer */

        .footer {
            padding: 24px;
            text-align: center;
            background: #f7f8fa;
        }

        .footer-text {
            margin: 0;
            font-size: 11px;
            line-height: 18px;
            color: #999999;
        }

        /* Mobile */

        @media screen and (max-width: 600px) {
            .header {
                padding: 26px 18px 20px;
            }

            .section,
            .category-section,
            .web-section {
                padding-left: 18px;
                padding-right: 18px;
            }

            .footer {
                padding-left: 18px;
                padding-right: 18px;
            }

            .brand {
                font-size: 25px;
                line-height: 32px;
            }

            .section-title,
            .category-name {
                font-size: 19px;
            }

            .hl-title {
                font-size: 17px;
                line-height: 25px;
            }
        }
    </style>
</head>

<body>

<table role="presentation" width="100%" class="email-wrapper">
    <tr>
        <td align="center">

            <table role="presentation"
                   width="100%"
                   class="email-container">

                <!-- ============================= -->
                <!-- Header -->
                <!-- ============================= -->

                <tr>
                    <td class="header">

                        <h1 class="brand">
                            {{TITLE}}
                        </h1>

                        <div class="date">
                            {{DATE_LINE}}
                        </div>

                    </td>
                </tr>


                <!-- ============================= -->
                <!-- 今日摘要 -->
                <!-- ============================= -->

                <tr>
                    <td class="section">

                        <h2 class="section-title">
                            今日摘要
                        </h2>

                        <div class="summary">
                            <p class="summary-overview">{{SUMMARY_OVERVIEW}}</p>
                            <ul class="key-points">
                                {{KEY_POINTS_HTML}}
                            </ul>
                        </div>

                    </td>
                </tr>


                <!-- ============================= -->
                <!-- 重点新闻 -->
                <!-- ============================= -->

                <tr id="highlights-section">
                    <td class="section">

                        <h2 class="section-title">
                            重点新闻
                        </h2>

                        <div id="highlights-container">
                            {{HIGHLIGHTS_HTML}}
                        </div>

                    </td>
                </tr>


                <!-- ============================= -->
                <!-- 全部栏目（由 generate.js 注入） -->
                <!-- ============================= -->

                {{CATEGORIES_HTML}}


                <!-- ============================= -->
                <!-- 完整网页版 -->
                <!-- ============================= -->

                <tr>
                    <td class="web-section">

                        <a class="web-button"
                           href="{{WEB_LINK}}">
                            查看完整网页版早报 →
                        </a>

                    </td>
                </tr>


                <!-- ============================= -->
                <!-- Footer -->
                <!-- ============================= -->

                <tr>
                    <td class="footer">

                        <p class="footer-text">
                            {{FOOTER}} · 2026年8月30日
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
